# Render Blueprint — Potente Propiedades (Vite + React + server Express)
# Uso: en Render → New → Blueprint → conectás este repo → carga todo de acá.
# Web service (no estático) para que el asistente IA viva en /api/asistente.
# OJO: las claves NO van en el repo; se cargan en Render (sync: false).
services:
  - type: web
    name: potente-propiedades
    runtime: node
    plan: free
    # --include=dev es obligatorio: Render define NODE_ENV=production y con eso npm
    # omite las devDependencies. Vite vive ahí, así que sin esto el build muere con
    # "vite: not found". npm ci respeta el package-lock.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Cada push a main debe deployar solo. Sin esto veníamos empujando cada deploy a mano.
    autoDeploy: true
    branch: main
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false # SECRETA: se carga a mano en Render. Es la del asistente Marina.
      # Base de datos propia de Potente (São Paulo). Estas dos van en el archivo a
      # propósito: son PÚBLICAS — viajan al navegador dentro del bundle igual. Lo
      # que protege los datos es el RLS de la base, no esconder esta clave
      # (verificado con `npm run verificar-db`). La service_role NUNCA va acá.
      - key: VITE_SUPABASE_URL
        value: https://gqhpgexqbnqqqeynbucu.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_LQ_JxpWjM__E0uO2s3hcUA_L_hLFJgw
      # ShadeMap (sombras del mapa): key personal de Mateo, atada a su mail.
      # NO va en el repo (es público): se carga a mano en Render → Environment.
      # Sin la variable, el botón "Sombras" no existe y la web queda como antes.
      - key: VITE_SHADEMAP_API_KEY
        sync: false
