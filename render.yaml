# Render Blueprint — Potente Propiedades (Vite + React + server Express)
# Uso: en Render → New → Blueprint → conectás este repo → carga todo de acá.
# Web service (no estático) para que el asistente IA viva en /api/asistente.
# OJO: las claves NO van en el repo; se cargan en Render (sync: false).
services:
  - type: web
    name: potente-propiedades
    runtime: node
    plan: free
    # --include=dev es obligatorio: Render define NODE_ENV=production y con eso npm
    # omite las devDependencies. Vite vive ahí, así que sin esto el build muere con
    # "vite: not found". npm ci respeta el package-lock.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false # el asistente Marina (sin esto la web anda igual; el chat avisa que no está configurado)
      - key: VITE_SUPABASE_URL
        sync: false # vacías = demo con datos de muestra locales (modo actual)
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
