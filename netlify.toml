# Netlify config — Potente Propiedades
# Habilita las Netlify Functions (el "cerebro" del asistente web) y el fallback SPA.
[build]
  command = "npm run build"
  publish = "dist"

# Fija la versión de Node para que el auto-deploy de Netlify use la misma que probamos localmente.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El widget llama SIEMPRE a /api/asistente (mismo path en Render y Netlify).
[[redirects]]
  from = "/api/asistente"
  to = "/.netlify/functions/asistente"
  status = 200

# El Probador del panel usa /api/chat (chat genérico con la key del servidor).
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# El buscador de direcciones del panel (georef-ar + Nominatim, con sesión).
[[redirects]]
  from = "/api/geocodificar"
  to = "/.netlify/functions/geocodificar"
  status = 200

# SPA fallback (además de public/_redirects, por si el deploy no lo toma).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad, las mismas que pone el server de Render
# (netlify/functions/_seguridad.ts). Acá van para el sitio estático.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # Nadie puede meter el panel en un iframe suyo y robarle los clicks a Mateo.
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
