<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#022352" />

    <!-- ===== SEO base ===== -->
    <title>Potente Propiedades · Inmobiliaria en Mar del Plata | Venta y alquiler</title>
    <meta
      name="description"
      content="Inmobiliaria en Mar del Plata con más de 50 años y 3 generaciones. Casas, departamentos, PH, locales y lotes en venta y alquiler. Tasaciones sin cargo. Oficinas en Punta Mogotes y Chauvín."
    />
    <meta
      name="keywords"
      content="inmobiliaria mar del plata, casas en venta mar del plata, departamentos mar del plata, alquiler mar del plata, tasaciones mar del plata, punta mogotes, chauvin, playa grande, potente propiedades"
    />
    <!-- %VITE_SITE_URL% lo reemplaza Vite en el build (default garantizado en
         vite.config.ts, pisable con la variable de entorno al mudar de dominio). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="geo.region" content="AR-B" />
    <meta name="geo.placename" content="Mar del Plata" />

    <!-- ===== Open Graph / redes ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Potente Propiedades" />
    <meta property="og:title" content="Potente Propiedades · Inmobiliaria en Mar del Plata" />

      property="og:description"
      content="Más de 50 años y 3 generaciones en Mar del Plata. Casas, departamentos, locales y lotes en venta y alquiler. Tasaciones sin cargo."
    />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="%VITE_SITE_URL%/img/props/casa1.jpg" />

    <!-- ===== Datos estructurados: la inmobiliaria y sus 2 sucursales =====
         ⚠️ Esto es lo que Google lee como LocalBusiness: direcciones, teléfonos
         y horarios DEBEN coincidir con src/config/marca.ts (la fuente de verdad)
         y con el Google Business Profile. Acá vivieron tres datos falsos hasta el
         10-ago: la dirección VIEJA de Chauvín (Av. Colón 3537 — la real es
         Córdoba 3719), un teléfono fantasma (+54-223-472-7416, no existe en
         ningún otro lado del proyecto) y un horario global L-V 9-18 que pisaba
         los horarios reales por oficina. Un negocio con NAP inconsistente pierde
         ranking local, que es lo único que le importa a una inmobiliaria.
         Sin mail a propósito: el spec de Mateo pide contacto por WhatsApp.
         Las coordenadas se verificaron el 10-ago contra el registro oficial de
         calles (georef) y OpenStreetMap. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Potente Propiedades",
      "description": "Inmobiliaria en Mar del Plata con más de 50 años de trayectoria y tres generaciones. Venta y alquiler de casas, departamentos, PH, locales y lotes. Tasaciones profesionales.",
      "url": "%VITE_SITE_URL%/",
      "logo": "%VITE_SITE_URL%/img/marca/pp-azul.png",
      "sameAs": [
        "https://www.instagram.com/potentepropiedades",
        "https://www.facebook.com/potente.propiedades"
      ],
      "areaServed": { "@type": "City", "name": "Mar del Plata" },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+54-9-223-302-9591",
          "url": "https://wa.me/5492233029591",
          "availableLanguage": "es"
        }
      ],
      "department": [
        {
          "@type": "RealEstateAgent",
          "name": "Potente Propiedades · Chauvín",
          "telephone": "+54-223-512-9032",
          "address": { "@type": "PostalAddress", "streetAddress": "Córdoba 3719", "addressLocality": "Mar del Plata", "addressRegion": "Buenos Aires", "addressCountry": "AR" },
          "geo": { "@type": "GeoCoordinates", "latitude": -38.015554, "longitude": -57.559905 },
          "openingHoursSpecification": [
            { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "16:00" }
          ]
        },
        {
          "@type": "RealEstateAgent",
          "name": "Potente Propiedades · Punta Mogotes",
          "telephone": "+54-223-628-2659",
          "address": { "@type": "PostalAddress", "streetAddress": "Av. de los Trabajadores 2439", "addressLocality": "Mar del Plata", "addressRegion": "Buenos Aires", "addressCountry": "AR" },
          "geo": { "@type": "GeoCoordinates", "latitude": -38.064986, "longitude": -57.547426 },
          "openingHoursSpecification": [
            { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "18:00" },
            { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "12:00" }
          ]
        }
      ],
      "foundingDate": "1974",
      "slogan": "Tu inmobiliaria en Mar del Plata"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Potente Propiedades — Inmobiliaria en Mar del Plata</h1>
      <p>Más de 50 años y tres generaciones. Casas, departamentos, PH, locales y lotes en venta y alquiler. Oficinas: Córdoba 3719 (Chauvín, tel. 223 512-9032, lun a vie 9 a 16) y Av. de los Trabajadores 2439 (Punta Mogotes, tel. 223 628-2659, lun a vie 9 a 18 y sábados hasta las 12). Consultas por WhatsApp: +54 9 223 302-9591.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
